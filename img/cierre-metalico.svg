<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Cierre metálico">
  <rect width="640" height="420" fill="#f1eefb"/>
  <!-- Las dos cintas del cierre -->
  <rect x="246" y="50" width="66" height="320" rx="8" fill="#3b3550"/>
  <rect x="328" y="50" width="66" height="320" rx="8" fill="#3b3550"/>
  <!-- Dientes metálicos, intercalados -->
  <path d="M312 60 V250" stroke="#c9c9d6" stroke-width="14" stroke-dasharray="9 9"/>
  <path d="M328 60 V250" stroke="#c9c9d6" stroke-width="14" stroke-dasharray="9 9" stroke-dashoffset="9"/>
  <!-- Parte ya cerrada -->
  <path d="M320 250 V362" stroke="#c9c9d6" stroke-width="16" stroke-dasharray="6 5"/>
  <!-- Deslizador y jalador -->
  <path d="M290 228 H350 L340 282 H300 Z" fill="#e8a33d"/>
  <rect x="308" y="270" width="24" height="70" rx="12" fill="#e8a33d" stroke="#b97d22" stroke-width="3"/>
  <circle cx="320" cy="322" r="6" fill="#f1eefb"/>
</svg>
